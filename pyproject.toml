[project]
name = "api-engine"
version = "0.1.0"
description = "Autonomous API Discovery & Integration Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "tenacity>=9.0",
    "jsonschema>=4.23",
    "cryptography>=43.0",
    "numpy>=2.1",
    "typer>=0.15",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # ONNX-based local embeddings: no PyTorch, no API quota, and the retrieval
    # benchmark stays reproducible for anyone who clones the repo.
    "fastembed>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.8",
]

[project.scripts]
engine = "engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "markdown>=3.10.3",
    # pymupdf stamps the footer onto the rendered PDF and is the fallback
    # rasteriser. The report is printed by whatever Chrome or Edge is already
    # installed, so there is no browser to download before the docs will build.
    "pymupdf>=1.28.2",
    "pygments>=2.21.0",
    "pypdfium2>=5.13.0",
]
